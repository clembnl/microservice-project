apiVersion: v1
kind: Pod
metadata:
  name: kafka-debug
  namespace: microservices
spec:
  # Pod-level Security Context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001            # Non-root UID
    runAsGroup: 1001           # Non-root GID
    fsGroup: 1001              # File system group
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: kafka
    image: bitnami/kafka:latest
    command: ['sleep', '3600']
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true