apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: microservices
data:
  # Kafka Configuration
  KAFKA_CFG_ZOOKEEPER_CONNECT: "zookeeper:2181"
  KAFKA_CFG_LISTENERS: "SASL_SSL://:9092"
  KAFKA_CFG_ADVERTISED_LISTENERS: "SASL_SSL://kafka:9092"
  KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
  KAFKA_CFG_SASL_ENABLED_MECHANISMS: "PLAIN"
  KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "PLAIN"
  KAFKA_CFG_SSL_CLIENT_AUTH: "required"
  KAFKA_CFG_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
  KAFKA_CFG_SSL_KEY_PASSWORD: "kafka123"
  KAFKA_CFG_SSL_KEYSTORE_PASSWORD: "kafka123"
  KAFKA_CFG_SSL_TRUSTSTORE_PASSWORD: "kafka123"
  KAFKA_CFG_AUTHORIZER_CLASS_NAME: "kafka.security.authorizer.AclAuthorizer"
  KAFKA_CFG_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
  KAFKA_ZOOKEEPER_PROTOCOL: "SASL"
  KAFKA_CFG_ZOOKEEPER_SET_ACL: "true"
  KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "SASL_SSL:SASL_SSL"
  KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "SASL_SSL"
  KAFKA_HEAP_OPTS: "-Xmx2g -Xms1g"
  KAFKA_ZOOKEEPER_USER: "admin"
  KAFKA_ZOOKEEPER_PASSWORD: "admin-secret"
  BITNAMI_DEBUG: "false"
  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-jaas-config
  namespace: microservices
data:
  kafka_jaas.conf: |
    KafkaServer {
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin"
        password="admin-secret"
        user_admin="admin-secret"
        user_order-service="order-service-secret"
        user_user-service="user-service-secret"
        user_kafka-exporter="kafka-exporter-secret";
    };

    Client {
        org.apache.zookeeper.server.auth.DigestLoginModule required
        username="admin"
        password="admin-secret";
    };